name: dental-clinic

# The full stack: database, one-shot seeder, BI API, BI panel, public site.
#
#   cp .env.example .env && edit it
#   docker compose up -d --build
#
#   panel  -> http://localhost:8080   (login required)
#   site   -> http://localhost:3000   (public)

services:
  # ---------------------------------------------------------------- database
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-dental_clinic}
    volumes:
      - mongo-data:/data/db
    # Bound to localhost only — the API reaches Mongo over the internal
    # network, so this is for local tooling (Compass, mongosh) and must not
    # be published to 0.0.0.0 on a public VPS.
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [clinic]

  # ------------------------------------------------- CSV -> MongoDB (one-shot)
  seed:
    build:
      context: .
      dockerfile: seeder/Dockerfile
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB: ${MONGO_DB:-dental_clinic}
      DATA_DIR: /data
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      # The database account the API will use. Created here because the seeder
      # is the only service holding root credentials.
      API_DB_USERNAME: ${API_DB_USERNAME:-clinic_api}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?set API_DB_PASSWORD in .env}
    volumes:
      - ./data:/data:ro
    networks: [clinic]

  # ------------------------------------------------------------- BI API
  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      # The API authenticates as its own least-privilege user (created by the
      # seeder with readWrite on this database only), not as Mongo root. It
      # reads analytics and writes one collection, so a flaw in the API cannot
      # drop the database or read `admin`. The seeder keeps root because it
      # genuinely creates users and rebuilds collections.
      MONGO_URL: mongodb://${API_DB_USERNAME:-clinic_api}:${API_DB_PASSWORD:?set API_DB_PASSWORD in .env}@mongo:27017/${MONGO_DB:-dental_clinic}?authSource=${MONGO_DB:-dental_clinic}
      MONGO_DB: ${MONGO_DB:-dental_clinic}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      # nginx serves the panel from the same origin, so CORS never applies in
      # production and the allow-list is deliberately empty.
      CORS_ORIGINS: "[]"
      # Session cookie is only sent over TLS once a certificate is in front.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    # Not published: only `web` talks to it, over the internal network.
    expose:
      - "8000"
    networks: [clinic]

  # --------------------------------------------------------- BI panel (SPA)
  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks: [clinic]

  # ------------------------------------------------------- public clinic site
  site:
    build:
      context: .
      dockerfile: website/Dockerfile
    restart: unless-stopped
    # Static marketing pages rendered from clinic-data.json at build time —
    # no database and no API, so it depends on nothing.
    ports:
      - "${SITE_PORT:-3000}:3000"
    networks: [clinic]

  # ---------------------------------------------- regenerate data (on demand)
  # docker compose --profile generate run --rm generate
  generate:
    build:
      context: .
      dockerfile: seeder/Dockerfile
    profiles: [generate]
    command: python scripts/generate_data.py
    # generate_data.py resolves its output paths relative to the script, so
    # these mounts must mirror the repo layout inside /app.
    volumes:
      - ./data:/app/data
      - ./website/app:/app/website/app
    networks: [clinic]

volumes:
  mongo-data:

networks:
  clinic:
    driver: bridge
