[project]
name = "dental-clinic-api"
version = "1.0.0"
description = "FastAPI backend for the dental clinic BI system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "motor>=3.6",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    # Assistant. `openai` is the client for the AvalAI gateway, which is
    # OpenAI-compatible; `jdatetime` does the Jalali arithmetic models get
    # wrong. Retrieval is BM25 in-process — no vector store, no embedding
    # client, no numpy.
    "openai>=1.60",
    "jdatetime>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.28", "pymongo>=4.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
