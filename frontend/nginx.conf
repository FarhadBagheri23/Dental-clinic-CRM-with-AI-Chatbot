server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # `always` so these are sent on error responses too, not only on 2xx.
    #
    # frame-ancestors is the clickjacking control: without it the panel can be
    # framed invisibly over an attacker's page, and a click aimed at their
    # button lands on ours — on a panel whose buttons delete and log out.
    #
    # The CSP allows inline *styles* because Tailwind injects them, but not
    # inline script: the SPA is bundled, so script-src stays tight. Fonts are
    # self-hosted (vazirmatn ships in /assets), so no CDN needs allowing, and
    # connect-src is 'self' because nginx proxies /api on this same origin.
    add_header X-Content-Type-Options  "nosniff"     always;
    add_header Referrer-Policy         "same-origin" always;
    add_header X-Frame-Options         "DENY"        always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Vite emits content-hashed filenames, so these can never go stale.
    # add_header inside a location replaces the inherited set, so the security
    # headers above are repeated here rather than silently dropped.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The SPA shell must never be cached, or a deploy leaves clients holding
    # an index.html that references deleted asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        # Repeated for the same reason as in /assets/: any add_header in a
        # location discards the server-level set, and this is the one response
        # where losing the CSP would matter most.
        add_header X-Content-Type-Options  "nosniff"     always;
        add_header Referrer-Policy         "same-origin" always;
        add_header X-Frame-Options         "DENY"        always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The chatbot streams over SSE; buffering would hold tokens back
        # until the response completed.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Client-side routing: unknown paths return the shell, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;
}
